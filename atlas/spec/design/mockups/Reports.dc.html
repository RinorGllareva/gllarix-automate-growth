<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas — Reports</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#050608}a{color:#8FE3EE}a:hover{color:#BFF3F7}</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #050608; color: #EEF2F4; font-family: 'Geist', 'Helvetica Neue', Helvetica, sans-serif; overflow: hidden">
<dc-import name="Sidebar" active="reports" hint-size="240px,900px"></dc-import>
<main style="width: 1200px; display: flex; flex-direction: column">
<dc-import name="TopBar" context="WEEK 48 · 23–29 NOV" action="EXPORT" href="Reports.dc.html" hint-size="1200px,72px"></dc-import>
<div style="padding: 28px 40px; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; font-weight: 300; font-size: 40px; letter-spacing: -0.02em">Reports</h1>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px">
<section aria-label="Weekly funnel" style="background: #0A0D11; border: 1px solid #1A1F26; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 11px; letter-spacing: 0.22em; color: #8C96A0">WEEKLY FUNNEL · BDR</span>
<sc-for list="{{funnel}}" as="f" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 120px 1fr 70px 70px; gap: 12px; align-items: center; font-size: 13px">
<span style="color: #A4ADB6">{{f.label}}</span>
<div style="height: 22px; background: #12161C"><div style="width: {{f.w}}; height: 22px; background: {{f.c}}"></div></div>
<span style="font-family: 'Geist Mono', monospace; text-align: right">{{f.n}}</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #7B8590; text-align: right">{{f.rate}}</span>
</div>
</sc-for>
</section>
<section aria-label="MRR against plan" style="background: #0A0D11; border: 1px solid #1A1F26; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.22em; color: #8C96A0"><span>MRR AGAINST THE €10K PLAN</span><span style="color: #9FE3C4">AHEAD</span></div>
<svg width="100%" height="180" viewBox="0 0 520 180" role="img" aria-label="Plan line rising to 11,700 euros in June; actual MRR 456 euros in December, above plan">
<line x1="0" y1="160" x2="520" y2="160" stroke="#1A1F26"></line>
<line x1="0" y1="106" x2="520" y2="106" stroke="#12161C"></line>
<line x1="0" y1="52" x2="520" y2="52" stroke="#12161C"></line>
<polyline points="{{planPts}}" fill="none" stroke="#C6C0FF" stroke-width="1.5" stroke-dasharray="4 4"></polyline>
<polyline points="{{actPts}}" fill="none" stroke="#8FE3EE" stroke-width="2"></polyline>
<circle cx="{{actX}}" cy="{{actY}}" r="4" fill="#8FE3EE"></circle>
<text x="4" y="46" fill="#7B8590" font-size="10" font-family="Geist Mono, monospace">€10k</text>
<text x="4" y="100" fill="#7B8590" font-size="10" font-family="Geist Mono, monospace">€5k</text>
<text x="4" y="176" fill="#7B8590" font-size="10" font-family="Geist Mono, monospace">OCT</text>
<text x="486" y="176" fill="#7B8590" font-size="10" font-family="Geist Mono, monospace">JUN</text>
</svg>
<div style="display: flex; gap: 20px; font-size: 12px; color: #A4ADB6"><span>Actual Dec: <span style="font-family: 'Geist Mono', monospace; color: #8FE3EE">€456</span></span><span>Plan Dec: <span style="font-family: 'Geist Mono', monospace; color: #C6C0FF">€84</span></span><span>Plan Jun: <span style="font-family: 'Geist Mono', monospace">€11,700</span></span></div>
</section>
</div>
<div style="display: grid; grid-template-columns: 1fr 360px; gap: 20px">
<section aria-label="KPIs" style="border: 1px solid #1A1F26; background: #0A0D11">
<div style="display: grid; grid-template-columns: 1.6fr 1fr 1fr 110px; gap: 12px; padding: 12px 18px; font-size: 10px; letter-spacing: 0.2em; color: #7B8590; border-bottom: 1px solid #1A1F26"><span>KPI</span><span>THIS WEEK</span><span>TARGET</span><span>STATUS</span></div>
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="7">
<div style="display: grid; grid-template-columns: 1.6fr 1fr 1fr 110px; gap: 12px; align-items: center; padding: 0 18px; height: 42px; border-bottom: 1px solid #12161C; font-size: 13px">
<span>{{k.label}}</span><span style="font-family: 'Geist Mono', monospace">{{k.v}}</span><span style="font-family: 'Geist Mono', monospace; color: #7B8590">{{k.t}}</span>
<span style="justify-self: start; font-size: 10px; letter-spacing: 0.18em; border: 1px solid {{k.c}}; color: {{k.c}}; padding: 3px 8px">{{k.s}}</span>
</div>
</sc-for>
</section>
<section aria-label="Stage gates" style="background: #0A0D11; border: 1px solid #1A1F26; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 11px; letter-spacing: 0.22em; color: #8C96A0">STAGE GATES</span>
<sc-for list="{{gates}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span>{{g.label}}</span><span style="font-family: 'Geist Mono', monospace; color: #A4ADB6">{{g.v}}</span></div>
<div style="height: 3px; background: #1A1F26"><div style="width: {{g.w}}; height: 3px; background: {{g.c}}"></div></div>
<span style="font-size: 11px; color: #7B8590">{{g.note}}</span>
</div>
</sc-for>
</section>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const plan = [0, 0, 84, 565, 3066, 4535, 6576, 8818, 11712];
    const act = [0, 0, 456];
    const x = (i) => Math.round(40 + i * 60);
    const y = (v) => Math.round(160 - v / 10000 * 108);
    const pts = (a) => a.map((v, i) => x(i) + ',' + y(v)).join(' ');
    const G = '#9FE3C4', AM = '#D2AE72';
    return {
      planPts: pts(plan), actPts: pts(act), actX: x(2), actY: y(456),
      funnel: [
        { label: 'Dials', n: '612', rate: '', w: '100%', c: '#2A3A44' },
        { label: 'Connects', n: '71', rate: '12%', w: '48%', c: '#3E6E78' },
        { label: 'Conversations', n: '44', rate: '62%', w: '38%', c: '#5E9CA6' },
        { label: 'Booked', n: '5', rate: '11%', w: '16%', c: '#8FE3EE' },
        { label: 'Held', n: '4', rate: '80%', w: '13%', c: '#9FE3C4' },
        { label: 'Won', n: '1', rate: '25%', w: '6%', c: '#C6C0FF' }
      ],
      kpis: [
        { label: 'Dials per day', v: '122', t: '60–70 · stretch 100', s: 'AHEAD', c: G },
        { label: 'Conversations per day', v: '8.8', t: '6–10', s: 'ON TRACK', c: G },
        { label: 'Meetings booked', v: '5', t: '4+', s: 'ON TRACK', c: G },
        { label: 'Show rate', v: '80%', t: '70%+', s: 'ON TRACK', c: G },
        { label: 'Approved / booked', v: '80%', t: '80%+', s: 'ON TRACK', c: G },
        { label: 'CRM updated same day', v: '97%', t: '100%', s: 'WATCH', c: AM },
        { label: 'Close rate on held', v: '25%', t: '20%+', s: 'ON TRACK', c: G }
      ],
      gates: [
        { label: 'Gate 1 · 3 paying clients', v: '2 / 3', w: '67%', c: '#8FE3EE', note: 'Then promote the BDR to closer and hire setter #1' },
        { label: 'Gate 2 · €2,000 MRR for 2 months', v: '€456', w: '23%', c: '#C6C0FF', note: 'Then add a second channel and an implementer' },
        { label: 'Gate 3 · €5,000 MRR, churn under 5%', v: '€456', w: '9%', c: '#D2AE72', note: 'Then build pods of 1 closer + 2–3 setters' }
      ]
    };
  }
}
</script>
</body>
</html>
