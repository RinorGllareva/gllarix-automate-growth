<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1200px; height: 72px; box-sizing: border-box; background: #050608; border-bottom: 1px solid #1A1F26; display: flex; align-items: center; gap: 24px; padding: 0 40px; font-family: 'Geist', 'Helvetica Neue', Helvetica, sans-serif; color: #EEF2F4">
<label style="display: flex; align-items: center; gap: 10px; width: 380px; height: 40px; box-sizing: border-box; border: 1px solid #1A1F26; padding: 0 12px; color: #8C96A0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C96A0" stroke-width="1.6" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14a7 7 0 0 0 0 14M20 20l-4-4"></path></svg>
<input type="search" aria-label="Search leads, companies, deals" placeholder="Search leads, companies, deals" style="flex-grow: 1; background: transparent; border: 0; outline: none; color: #EEF2F4; font-family: inherit; font-size: 13px">
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; border: 1px solid #2A313A; padding: 2px 6px">⌘K</span>
</label>
<div style="margin-left: auto; display: flex; align-items: center; gap: 20px">
<span style="font-size: 11px; letter-spacing: 0.22em; color: #8C96A0">{{context}}</span>
<button type="button" aria-label="Notifications, 3 unread" style="position: relative; width: 40px; height: 40px; background: transparent; border: 1px solid #1A1F26; color: #EEF2F4; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EEF2F4" stroke-width="1.5" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"></path></svg>
<span style="position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; background: #8FE3EE"></span>
</button>
<a href="{{href}}" style="height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 18px; border: 1px solid #3A424C; color: #EEF2F4; text-decoration: none; font-size: 12px; letter-spacing: 0.22em">
<span>{{action}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#EEF2F4" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"context":{"editor":"text","default":"TUE 1 DEC · BDR SHIFT 08:00–16:00 VET"},"action":{"editor":"text","default":"START CALLING"},"href":{"editor":"text","default":"Call.dc.html"},"$preview":{"width":1200,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      context: this.props.context ?? 'TUE 1 DEC · BDR SHIFT 08:00–16:00 VET',
      action: this.props.action ?? 'START CALLING',
      href: this.props.href ?? 'Call.dc.html'
    };
  }
}
</script>
</body>
</html>
