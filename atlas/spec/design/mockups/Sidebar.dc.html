<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 240px; height: 900px; box-sizing: border-box; background: #050608; border-right: 1px solid #1A1F26; display: flex; flex-direction: column; padding: 28px 16px 20px 16px; font-family: 'Geist', 'Helvetica Neue', Helvetica, sans-serif; color: #EEF2F4">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 12px 28px 12px">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EEF2F4" stroke-width="1.6" aria-hidden="true"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"></path><path d="M12 8v8M8 10.3l8 3.4"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 500; letter-spacing: 0.28em">ATLAS</span>
<span style="font-size: 10px; letter-spacing: 0.22em; color: #8C96A0">BY GLLARIX</span>
</div>
</div>
<div style="font-size: 11px; letter-spacing: 0.22em; color: #8C96A0; padding: 0 12px 10px 12px">WORKSPACE</div>
<nav aria-label="Main" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="9">
<a href="{{item.href}}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; text-decoration: none; font-size: 14px; background: {{item.bg}}; color: {{item.fg}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{item.ic}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
<span>{{item.label}}</span>
<span style="margin-left: auto; font-family: 'Geist Mono', monospace; font-size: 11px; color: {{item.ic}}">{{item.key}}</span>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 16px">
<div style="border: 1px solid #1A1F26; padding: 14px 14px 16px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.22em; color: #8C96A0"><span>QUEUE</span><span style="font-family: 'Geist Mono', monospace; letter-spacing: 0">62 / 150</span></div>
<div style="height: 3px; background: #1A1F26"><div style="width: 41%; height: 3px; background: #8FE3EE"></div></div>
<div style="font-size: 12px; color: #A4ADB6">East window open until 09:00 ET</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 0 4px">
<div style="width: 36px; height: 36px; border: 1px solid #3A424C; display: flex; align-items: center; justify-content: center; font-size: 12px; letter-spacing: 0.08em">RG</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px">Rinor</span>
<span style="font-size: 11px; color: #8C96A0">Admin</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","call","leads","pipeline","meetings","deals","clients","reports","tasks","team","time","cofounder","admin"],"default":"today"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'today';
    const items = [
      { id: 'today', label: 'Today', href: 'Main.dc.html', key: 'G T', icon: 'M12 7v5l3 2M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18' },
      { id: 'call', label: 'Call workspace', href: 'Call.dc.html', key: 'G C', icon: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2' },
      { id: 'leads', label: 'Leads', href: 'Leads.dc.html', key: 'G L', icon: 'M9 11a4 4 0 1 0 0-8a4 4 0 0 0 0 8M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.1a4 4 0 0 1 0 7.8M21 21v-2a4 4 0 0 0-3-3.9' },
      { id: 'pipeline', label: 'Pipeline', href: 'Pipeline.dc.html', key: 'G P', icon: 'M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v6h-4z' },
      { id: 'meetings', label: 'Meetings', href: 'Meetings.dc.html', key: 'G M', icon: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4' },
      { id: 'deals', label: 'Deals and quotes', href: 'Deal.dc.html', key: 'G D', icon: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6' },
      { id: 'clients', label: 'Clients', href: 'Clients.dc.html', key: 'G K', icon: 'M4 21V5l8-3 8 3v16M9 21v-4h6v4M8 9h1M15 9h1M8 13h1M15 13h1' },
      { id: 'reports', label: 'Reports', href: 'Reports.dc.html', key: 'G R', icon: 'M4 20V10M10 20V4M16 20v-7M3 20h18' },
      { id: 'tasks', label: 'Tasks and planner', href: 'Tasks.dc.html', key: 'G W', icon: 'M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2' },
      { id: 'team', label: 'Team performance', href: 'Team.dc.html', key: 'G E', icon: 'M4 20h16M6 16l4-5 3 3 5-7M18 7h-3M18 7v3' },
      { id: 'time', label: 'Time tracking', href: 'Time.dc.html', key: 'G H', icon: 'M12 8v4l2.5 2.5M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M9 1.5h6' },
      { id: 'cofounder', label: 'AI co-founder', href: 'Advisor.dc.html', key: 'G I', icon: 'M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4zM18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z' },
      { id: 'admin', label: 'Admin', href: 'Admin.dc.html', key: 'G A', icon: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4' }
    ];
    return {
      items: items.map((i) => ({
        ...i,
        bg: i.id === a ? '#EAF6F8' : 'transparent',
        fg: i.id === a ? '#0A0D10' : '#A4ADB6',
        ic: i.id === a ? '#0A0D10' : '#7B8590'
      }))
    };
  }
}
</script>
</body>
</html>
