<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas — Tasks list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#050608}a{color:#8FE3EE}a:hover{color:#BFF3F7}</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #050608; color: #EEF2F4; font-family: 'Geist', 'Helvetica Neue', Helvetica, sans-serif; overflow: hidden">
<dc-import name="Sidebar" active="tasks" hint-size="240px,900px"></dc-import>
<main style="width: 1200px; display: flex; flex-direction: column">
<dc-import name="TopBar" context="COMPANY / Q4 LAUNCH · WEEK 40" action="PLAN WITH AI" href="Planner.dc.html" hint-size="1200px,72px"></dc-import>
<div style="display: flex; flex-grow: 1">
<dc-import name="TaskSpaces" hint-size="220px,828px"></dc-import>
<div style="width: 980px; display: flex; flex-direction: column">
<dc-import name="ViewTabs" active="list" hint-size="980px,64px"></dc-import>
<div style="padding: 20px 32px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<h1 style="margin: 0; font-weight: 300; font-size: 34px; letter-spacing: -0.02em">Q4 launch</h1>
<span style="font-size: 12px; color: #A4ADB6">11 open · 29.5 h estimated · most due before the BDR starts on 12 Oct</span>
</div>
<div style="display: grid; grid-template-columns: 20px 1fr 110px 90px 70px 56px 104px; gap: 12px; padding: 0 12px; font-size: 10px; letter-spacing: 0.2em; color: #7B8590"><span></span><span>TASK</span><span>OWNER</span><span>DUE</span><span>PRIORITY</span><span>EST.</span><span>CATEGORY</span></div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section aria-label="{{g.name}}" style="display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; font-size: 11px; letter-spacing: 0.22em; color: {{g.c}}; border-bottom: 1px solid #1A1F26"><span style="width: 8px; height: 8px; background: {{g.c}}"></span><span>{{g.name}}</span><span style="font-family: 'Geist Mono', monospace; color: #7B8590">{{g.n}}</span></div>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
<a href="TaskDetail.dc.html" style="display: grid; grid-template-columns: 20px 1fr 110px 90px 70px 56px 104px; gap: 12px; align-items: center; height: 44px; padding: 0 12px; border-bottom: 1px solid #12161C; text-decoration: none; color: #EEF2F4; font-size: 13px">
<span style="width: 12px; height: 12px; border: 1px solid {{g.c}}"></span>
<span style="display: flex; gap: 10px; align-items: center"><span>{{r.t}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #7B8590">{{r.sub}}</span><span style="font-size: 9px; letter-spacing: 0.18em; color: #8FE3EE">{{r.ai}}</span></span>
<span style="color: #A4ADB6">{{r.o}}</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: {{r.dc}}">{{r.d}}</span>
<span style="font-size: 11px; color: {{r.pc}}">{{r.p}}</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #A4ADB6">{{r.e}}</span>
<span style="justify-self: start; font-size: 9px; letter-spacing: 0.18em; border: 1px solid #2A313A; color: #A4ADB6; padding: 3px 6px">{{r.c}}</span>
</a>
</sc-for>
</section>
</sc-for>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const P = { High: '#EE9A8C', Medium: '#D2AE72', Low: '#7B8590' };
    const row = (t, o, d, p, e, c, sub, ai, late) => ({ t, o, d, p, e, c, sub: sub || '', ai: ai ? 'AI' : '', pc: P[p], dc: late ? '#EE9A8C' : '#A4ADB6' });
    return {
      groups: [
        { name: 'IN PROGRESS', n: '3', c: '#8FE3EE', rows: [
          row('Build the live Gllarix demo line', 'Rinor', 'Sat 3 Oct', 'High', '8h', 'DEVELOPMENT', '2/6'),
          row('Post the BDR job and screen applicants', 'Co-founder', 'Fri 2 Oct', 'High', '3h', 'MANAGEMENT', '1/4'),
          row('Atlas M0 foundation (agent)', 'Codex · Rinor reviews', 'Sun 4 Oct', 'High', '2h', 'DEVELOPMENT') ] },
        { name: 'TO DO', n: '7', c: '#EEF2F4', rows: [
          row('Approve price book v2 and pilot rule', 'Both', 'Wed 30 Sep', 'High', '1h', 'FINANCE', '', false, true),
          row('Write the offer sheet and call script', 'Co-founder', 'Fri 2 Oct', 'High', '3h', 'SALES'),
          row('Pull the first 500 US trades leads', 'Co-founder', 'Sun 4 Oct', 'High', '4h', 'LEAD GEN'),
          row('Register US SMS for the demo number', 'Rinor', 'Sun 4 Oct', 'Medium', '1h', 'OPERATIONS'),
          row('Measure real cost per minute (25 test calls)', 'Rinor', 'Sun 11 Oct', 'Medium', '2h', 'RESEARCH', '', true),
          row('Confirm country rules with a lawyer', 'Co-founder', 'Sun 18 Oct', 'Medium', '3h', 'OPERATIONS', '0/4', true),
          row('Research Dubai 3D pricing', 'Co-founder', 'Fri 16 Oct', 'Low', '2h', 'RESEARCH', '', true) ] },
        { name: 'REVIEW', n: '1', c: '#C6C0FF', rows: [
          row('Update the context pack after this week', 'Rinor', 'Sun 4 Oct', 'Low', '0.5h', 'MANAGEMENT') ] }
      ]
    };
  }
}
</script>
</body>
</html>
